<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Músicas - iTunes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <h1>Fetch API - Música</h1>
        <p>Busque músicas e artistas utilizando a API do iTunes.</p>

        <div class="busca">

            <label for="musica">Digite o nome da música ou do artista:</label>

            <input
                type="text"
                id="musica"
                placeholder="Ex.: Djavan,Justin Bieber,Sza">

            <button onclick="buscarMusica()">
                Buscar
            </button>

        </div>

        <div id="resultado"></div>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
